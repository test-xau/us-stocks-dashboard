<script>
function atrCalc(d, p) {
  p = p || 14;
  const out = new Array(d.length).fill(null);
  if (d.length <= p) return out;
  let sum = 0, a = null;
  for (let i = 1; i < d.length; i++) {
    const t = Math.max(d[i].high - d[i].low, Math.abs(d[i].high - d[i-1].close), Math.abs(d[i].low - d[i-1].close));
    if (i <= p) { sum += t; if (i === p) { a = sum / p; out[i] = a; } }
    else { a = (a * (p - 1) + t) / p; out[i] = a; }
  }
  return out;
}

// pick TP candidates from swing levels, require R:R >= 1.5
function smcTargets(dir, entry, risk, swH, swL) {
  const c = dir === 1
    ? swH.filter(s => s.price > entry).map(s => s.price).sort((x, y) => x - y)
    : swL.filter(s => s.price < entry).map(s => s.price).sort((x, y) => y - x);
  const ok = c.filter(p => Math.abs(p - entry) / risk >= 1.5);
  if (!ok.length) return null;
  const tp1 = ok[0];
  const far = ok.filter(p => Math.abs(p - tp1) >= 0.5 * risk)[0];
  const tp2 = far !== undefined ? far
    : (dir === 1 ? Math.max(entry + 3 * risk, tp1 + risk) : Math.min(entry - 3 * risk, tp1 - risk));
  return { tp1, tp2 };
}

// d: CLOSED candles only. L: swing length. livePrice: current price.
function smcAnalyze(d, L, livePrice) {
  const n = d.length;
  const R = { events: [], obs: [], fvgs: [], eq: [], sr: [], signals: [], range: null, trend: 0, atr: 0, plan: null,
              stats: { win: 0, loss: 0, open: 0, r: 0 } };
  if (n < L * 2 + 30) return R;

  const H = d.map(c => c.high), Lo = d.map(c => c.low), C = d.map(c => c.close);
  const atr = atrCalc(d, 14);
  let A = atr[n-1] || (H[n-1] - Lo[n-1]) || 1;
  R.atr = A;

  const sufH = new Array(n + 1).fill(-Infinity), sufL = new Array(n + 1).fill(Infinity);
  for (let i = n - 1; i >= 0; i--) { sufH[i] = Math.max(H[i], sufH[i+1]); sufL[i] = Math.min(Lo[i], sufL[i+1]); }

  let top = null, bot = null, trend = 0, lastH = null, lastL = null;
  const swH = [], swL = [], obs = [], fvgs = [], events = [], signals = [];

  for (let j = 0; j < n; j++) {
    const a = atr[j] || A;

    // 1) confirm swing pivot at p = j - L
    const p = j - L;
    if (p >= L) {
      let isH = true, isL = true;
      for (let k = p - L; k <= p + L; k++) {
        if (k === p) continue;
        if (k < p) { if (H[k] >= H[p]) isH = false; if (Lo[k] <= Lo[p]) isL = false; }
        else       { if (H[k] >  H[p]) isH = false; if (Lo[k] <  Lo[p]) isL = false; }
      }
      if (isH) { const s = { idx: p, price: H[p], crossed: false }; swH.push(s); top = s; lastH = s; }
      if (isL) { const s = { idx: p, price: Lo[p], crossed: false }; swL.push(s); bot = s; lastL = s; }
    }

    // 2) mitigation (close through the zone)
    for (const o of obs) {
      if (!o.active || o.born >= j) continue;
      if (o.dir === 1 ? C[j] < o.bottom : C[j] > o.top) { o.active = false; o.mit = j; }
    }
    for (const g of fvgs) {
      if (!g.active || g.idx + 1 >= j) continue;
      if (g.dir === 1 ? C[j] < g.bottom : C[j] > g.top) { g.active = false; g.mit = j; }
    }

    // 3) structure breaks (close beyond swing) -> BOS / CHoCH + order block
    if (top && !top.crossed && C[j] > top.price) {
      top.crossed = true;
      events.push({ type: trend === -1 ? 'CHoCH' : 'BOS', dir: 1, from: top.idx, to: j, price: top.price });
      trend = 1;
      let mi = top.idx;
      for (let k = top.idx; k <= j; k++) if (Lo[k] < Lo[mi]) mi = k;
      obs.push({ dir: 1, top: H[mi], bottom: Lo[mi], idx: mi, born: j, active: true, signaled: false });
    }
    if (bot && !bot.crossed && C[j] < bot.price) {
      bot.crossed = true;
      events.push({ type: trend === 1 ? 'CHoCH' : 'BOS', dir: -1, from: bot.idx, to: j, price: bot.price });
      trend = -1;
      let mi = bot.idx;
      for (let k = bot.idx; k <= j; k++) if (H[k] > H[mi]) mi = k;
      obs.push({ dir: -1, top: H[mi], bottom: Lo[mi], idx: mi, born: j, active: true, signaled: false });
    }

    // 4) fair value gaps
    if (j >= 2) {
      if (Lo[j] > H[j-2] && (Lo[j] - H[j-2]) > 0.15 * a)
        fvgs.push({ dir: 1, top: Lo[j], bottom: H[j-2], idx: j - 1, active: true });
      else if (H[j] < Lo[j-2] && (Lo[j-2] - H[j]) > 0.15 * a)
        fvgs.push({ dir: -1, top: Lo[j-2], bottom: H[j], idx: j - 1, active: true });
    }

    // 5) entry signals: price taps an unmitigated OB in the direction of structure and closes back out
    if (trend !== 0 && lastH && lastL && lastH.price > lastL.price) {
      const eq = (lastH.price + lastL.price) / 2;
      for (const o of obs) {
        if (!o.active || o.signaled || o.dir !== trend || o.born >= j) continue;
        let ok = false;
        if (trend === 1)  ok = Lo[j] <= o.top && C[j] > o.top && C[j] <= eq;       // discount only
        if (trend === -1) ok = H[j] >= o.bottom && C[j] < o.bottom && C[j] >= eq;  // premium only
        if (!ok) continue;
        const entry = C[j];
        const sl = trend === 1 ? o.bottom - 0.25 * a : o.top + 0.25 * a;
        const risk = Math.abs(entry - sl);
        if (!(risk > 0)) continue;
        const t = smcTargets(trend, entry, risk, swH, swL);
        if (!t) continue;
        o.signaled = true;
        signals.push({ idx: j, dir: trend, entry, sl, tp1: t.tp1, tp2: t.tp2, rr: Math.abs(t.tp1 - entry) / risk });
      }
    }
  }

  // outcome of every signal (SL checked first when both are hit in one bar = conservative)
  for (const s of signals) {
    s.res = 'open';
    for (let k = s.idx + 1; k < n; k++) {
      const hitSL = s.dir === 1 ? Lo[k] <= s.sl : H[k] >= s.sl;
      const hitTP = s.dir === 1 ? H[k] >= s.tp1 : Lo[k] <= s.tp1;
      if (hitSL) { s.res = 'loss'; s.end = k; break; }
      if (hitTP) { s.res = 'win';  s.end = k; break; }
    }
    if (s.res === 'win') { R.stats.win++; R.stats.r += s.rr; }
    else if (s.res === 'loss') { R.stats.loss++; R.stats.r -= 1; }
    else R.stats.open++;
  }
  R.signals = signals.slice(-20);

  R.trend = trend;
  R.events = events.slice(-14);
  R.obs = obs.filter(o => o.active && o.dir === 1).slice(-4).concat(obs.filter(o => o.active && o.dir === -1).slice(-4));
  R.fvgs = fvgs.filter(g => g.active && g.dir === 1).slice(-5).concat(fvgs.filter(g => g.active && g.dir === -1).slice(-5));
  if (lastH && lastL && lastH.price > lastL.price) R.range = { hi: lastH, lo: lastL };

  // equal highs / equal lows that have not been swept yet
  const tol = 0.25 * A;
  const scan = (sw, isHigh) => {
    const arr = sw.slice(-30), found = [];
    for (let k = arr.length - 1; k >= 1 && found.length < 3; k--) {
      for (let i = k - 1; i >= Math.max(0, k - 10); i--) {
        if (arr[k].idx - arr[i].idx < L * 2) continue;
        if (Math.abs(arr[k].price - arr[i].price) > tol) continue;
        const lvl = isHigh ? Math.max(arr[k].price, arr[i].price) : Math.min(arr[k].price, arr[i].price);
        const swept = isHigh ? sufH[arr[i].idx + 1] > lvl : sufL[arr[i].idx + 1] < lvl;
        if (swept) continue;
        if (found.some(f => Math.abs(f.price - lvl) < tol / 2)) continue;
        found.push({ dir: isHigh ? 1 : -1, price: lvl, i1: arr[i].idx, i2: arr[k].idx });
        break;
      }
    }
    return found;
  };
  R.eq = scan(swH, true).concat(scan(swL, false));

  // support / resistance = clusters of swing points touched at least twice
  const price = livePrice != null ? livePrice : C[n-1];
  const pts = swH.slice(-40).map(s => s.price).concat(swL.slice(-40).map(s => s.price)).sort((x, y) => x - y);
  const clusters = [];
  for (const pr of pts) {
    const last = clusters[clusters.length - 1];
    if (last && pr - last.max <= 0.5 * A) { last.sum += pr; last.n++; last.max = pr; }
    else clusters.push({ sum: pr, n: 1, max: pr });
  }
  const levels = clusters.map(c => ({ price: c.sum / c.n, touches: c.n })).filter(l => l.touches >= 2);
  const above = levels.filter(l => l.price > price).sort((x, y) => x.price - y.price).slice(0, 3).map(l => ({ ...l, kind: 'R' }));
  const below = levels.filter(l => l.price <= price).sort((x, y) => y.price - x.price).slice(0, 3).map(l => ({ ...l, kind: 'S' }));
  R.sr = above.concat(below);

  // trade plan: an open signal (recent) or a pending setup at the nearest OB
  const open = signals.filter(s => s.res === 'open' && n - 1 - s.idx <= 100).pop();
  if (open) {
    R.plan = { kind: 'signal', dir: open.dir, entry: open.entry, sl: open.sl, tp1: open.tp1, tp2: open.tp2, rr: open.rr, start: open.idx };
  } else if (trend !== 0) {
    const cand = obs.filter(o => o.active && o.dir === trend && (trend === 1 ? o.bottom < price : o.top > price));
    if (cand.length) {
      const o = trend === 1 ? cand.reduce((m, x) => x.top > m.top ? x : m) : cand.reduce((m, x) => x.bottom < m.bottom ? x : m);
      const entry = trend === 1 ? Math.min(o.top, price) : Math.max(o.bottom, price);
      const sl = trend === 1 ? o.bottom - 0.25 * A : o.top + 0.25 * A;
      const risk = Math.abs(entry - sl);
      if (risk > 0) {
        const t = smcTargets(trend, entry, risk, swH, swL);
        if (t) R.plan = { kind: 'pending', dir: trend, entry, sl, tp1: t.tp1, tp2: t.tp2, rr: Math.abs(t.tp1 - entry) / risk,
                          start: n, inZone: price <= o.top && price >= o.bottom };
      }
    }
  }
  R.swH = swH; R.swL = swL; R.A = A;
  return R;
}
</script>

// ---------- PO3 dealing range + Goldbach/IPDA + AMD(CLS) + 20-40-60 (จากหนังสือ hopiplaka) ----------
const IPDA = [[0,'High'],[3,'RB'],[11,'OB'],[17,'FVG'],[29,'LV'],[41,'BR'],[47,'MB'],[50,'EQ'],[53,'MB'],[59,'BR'],[71,'LV'],[83,'FVG'],[89,'OB'],[97,'RB'],[100,'Low']];

const lv = q => PO.hi - q / 100 * PO.size;                                   // 0 = High, 100 = Low
function po3Range(p){ const sc = sc5(p), N = Math.floor(p / sc + 1e-9), lo = Math.floor(N / S.pr) * S.pr * sc; return { lo, hi:lo + S.pr * sc, size:S.pr * sc, sc }; }
function ipdaCalc(){

  const raw = algo === 1 ? [Z(41), Z(3)] : [Z(47), Z(29), Z(3)], tps = raw.filter(t => (t - entry) * b > 0);
  const risk = Math.abs(entry - sl) || 1;
  const st = pq >= zq[0] && pq <= zq[1] ? 'in' : pq < zq[0] ? 'wait' : 'past';
  IP = { dir:b, algo, entry, tpsRaw:raw, z1:Z(zq[0]), z2:Z(zq[1]), sl, tps, rr:tps.map(t => Math.abs(t - entry) / risk), st, pq, zq, swept, ok:!!(M.fact.ok && M.cnt >= 3) };
}
function lbAnchors(y){ return LBN.map(n => { const m = Math.floor(n / 10), d = n % 10; let t = Date.UTC(y, m - 1, d); const wd = new Date(t).getUTCDay(); if (wd === 6) t += 2 * 864e5; else if (wd === 0) t += 864e5; return { n, t:t / 1000 }; }); }
function lbCalc(){

  let i = -1; A.forEach((a, j) => { if (a.t <= now) i = j; }); if (i < 3) return null;
  const cur = A[i], t0 = A[i-3].t, unit = cur.n * sc5(p), days = Math.floor((now - cur.t) / 86400), gaps = [];
  for (let j = 1; j < D.length - 1; j++){

    let g = null;
    if (c.low > a.high) g = { bull:true, top:c.low, bottom:a.high }; else if (c.high < a.low) g = { bull:false, top:a.low, bottom:c.high };
    if (!g) continue; g.size = g.top - g.bottom; g.t = D[j].u;

}

function sweepScan(){

// ---------- Backtest (เล่นซ้ำตรรกะเดียวกับ EA บนข้อมูลย้อนหลังของ Binance) ----------
async function runBacktest(){
  if (btBusy){ btStop = true; return; }
  const out = $('labBt'), N = +$('labBtN').value, W = 500, COST = 0.00008, MAXDAY = 3, TIMEOUT = 300;
  btBusy = true; btStop = false; $('labBtGo').textContent = 'หยุด';
  const saved = { C, D, KC, R, SW, H, CR, M, IP, LB, SM, PS, PK, PO };
  try {
    out.textContent = 'กำลังดึงข้อมูลย้อนหลัง…';
    const sym = MAP[S.sym] || S.sym;
    const hist = await fetchHist(sym, S.tf, N + 1); hist.pop();                       // ตัดแท่งที่ยังไม่ปิด
    const daily = await fetchHist(sym, '1d', 1000);
    let cm = new Map(); if (S.smt && S.smtSym){ try { (await fetchHist(S.smtSym, S.tf, N + 1)).forEach(k => cm.set(k.u, k)); } catch(e){ cm = new Map(); } }
    const T = hist.length; if (T < W + 50) throw new Error('ข้อมูลไม่พอ');
    const trades = [], dayN = new Map(); let pos = null, pend = null, dEnd = 0, t = W;
    const stat = () => { const w = trades.filter(x => x.R > 0).length; out.textContent = `กำลังรัน ${t - W}/${T - W} · เทรด ${trades.length} · ชนะ ${w}`; };
    const close = (bar, px, why) => { const risk = Math.abs(pos.entry - pos.sl), R0 = (px - pos.entry) * pos.dir / risk - pos.entry * COST / risk; trades.push({ u:pos.u, id:pos.id, dir:pos.dir, entry:pos.entry, sl:pos.sl, tp:pos.tp, exit:px, R:R0, why }); pos = null; };
    await new Promise(resolveAll => {
      const step = () => {
        const t0 = performance.now();
        while (t < T && performance.now() - t0 < 40 && !btStop){
          const bar = hist[t], day = Math.floor(bar.u / 86400);
          if (!pos){
            const from = Math.max(0, t - W);
            C = hist.slice(from, t).map(k => ({ ...k, time:k.u })); C.push({ u:bar.u, time:bar.u, open:bar.open, high:bar.open, low:bar.open, close:bar.open });
            while (dEnd < daily.length && daily[dEnd].u < day * 86400) dEnd++;
            D = daily.slice(Math.max(0, dEnd - 300), dEnd);
            KC = C.map(c => corrCandle(cm.get(c.u)));
            pend = null;
            if (computeAll() && PK){
              const rs = resolve(PK, bar.open);
              if (rs){
                if (PK.kind === 'mkt'){ if ((dayN.get(day) || 0) < MAXDAY){ pos = { u:bar.u, id:PK.id, dir:PK.dir, entry:rs.entry, sl:rs.sl, tp:rs.tp, t0:t }; dayN.set(day, (dayN.get(day) || 0) + 1); } }
                else pend = { id:PK.id, dir:PK.dir, entry:rs.entry, sl:rs.sl, tp:rs.tp };
              }
            }
          } else pend = null;
          if (!pos && pend && (dayN.get(day) || 0) < MAXDAY){
            const d = pend.dir, hit = d === 1 ? bar.low <= pend.entry : bar.high >= pend.entry;
            if (hit){ const fp = d === 1 ? Math.min(pend.entry, bar.open) : Math.max(pend.entry, bar.open); pos = { u:bar.u, id:pend.id, dir:d, entry:fp, sl:pend.sl, tp:pend.tp, t0:t }; dayN.set(day, (dayN.get(day) || 0) + 1); pend = null; }
          }
          if (pos){
            const d = pos.dir, hitSL = d === 1 ? bar.low <= pos.sl : bar.high >= pos.sl, hitTP = d === 1 ? bar.high >= pos.tp : bar.low <= pos.tp;
            if (hitSL) close(bar, pos.sl, 'SL'); else if (hitTP) close(bar, pos.tp, 'TP'); else if (t - pos.t0 >= TIMEOUT) close(bar, bar.close, 'time');
          }
          t++;
        }
        stat();
        if (t < T && !btStop) setTimeout(step, 0); else resolveAll();
      };
      step();
    });
    // ---- สรุปผล
    const wins = trades.filter(x => x.R > 0), loss = trades.filter(x => x.R <= 0), sumR = trades.reduce((a, x) => a + x.R, 0);
    const gw = wins.reduce((a, x) => a + x.R, 0), gl = Math.abs(loss.reduce((a, x) => a + x.R, 0));
    let cum = 0, peak = 0, dd = 0; const pts = [0]; trades.forEach(x => { cum += x.R; pts.push(cum); peak = Math.max(peak, cum); dd = Math.max(dd, peak - cum); });
    const by = {}; trades.forEach(x => { const o = by[x.id] || (by[x.id] = { n:0, w:0, r:0 }); o.n++; if (x.R > 0) o.w++; o.r += x.R; });
    const days = ((hist[T-1].u - hist[W].u) / 86400).toFixed(0);
    const mn = Math.min(...pts), mx = Math.max(...pts), sx = i => (i / Math.max(1, pts.length - 1) * 236 + 2).toFixed(1), sy = v => (56 - (v - mn) / Math.max(1e-9, mx - mn) * 52).toFixed(1);
    const svg = `<svg viewBox="0 0 240 60" width="100%" height="60"><polyline fill="none" stroke="#2ebd9b" stroke-width="1.5" points="${pts.map((v, i) => sx(i) + ',' + sy(v)).join(' ')}"/></svg>`;
    const rowTxt = Object.keys(by).sort().map(k => `<div class="stat">Setup ${k}: ${by[k].n} ไม้ · ชนะ ${(by[k].w / by[k].n * 100).toFixed(0)}% · ${by[k].r >= 0 ? '+' : ''}${by[k].r.toFixed(1)}R</div>`).join('');
    out.innerHTML = `<b>Backtest ${S.sym} ${S.tf}</b> · ${T - W} แท่ง (~${days} วัน)${btStop ? ' · <span class="down">หยุดกลางทาง</span>' : ''}` +
      (trades.length ? `<div style="margin-top:4px">เทรด <b>${trades.length}</b> · ชนะ <b>${(wins.length / trades.length * 100).toFixed(0)}%</b> · รวม <b class="${sumR >= 0 ? 'up' : 'down'}">${sumR >= 0 ? '+' : ''}${sumR.toFixed(1)}R</b> · เฉลี่ย ${(sumR / trades.length).toFixed(2)}R</div>` +
      `<div>Profit Factor <b>${gl ? (gw / gl).toFixed(2) : '∞'}</b> · Max Drawdown <b>${dd.toFixed(1)}R</b></div>${rowTxt}${svg}` : '<div class="stat">ไม่มีสัญญาณตลอดช่วงนี้ (ลองเพิ่มจำนวนแท่ง หรือปรับ Timeframe)</div>') +
      `<div class="stat" style="font-size:10px;margin-top:4px">จำลองบนราคา PAXG/Binance: เข้าที่ราคาเปิดแท่งถัดไปหรือ Limit, SL ก่อน TP ถ้าชนในแท่งเดียวกัน, หักสเปรด 0.008%, ไม่เกิน ${MAXDAY} ไม้/วัน, ปิดทิ้งหลัง ${TIMEOUT} แท่ง · ไม่ใช่ผลรับประกัน และไม่ใช่คำแนะนำลงทุน</div><hr style="border:0;border-top:1px solid var(--line);margin:8px 0">`;
  } catch(e){ out.textContent = 'Backtest ไม่สำเร็จ: ' + e.message; }
  ({ C, D, KC, R, SW, H, CR, M, IP, LB, SM, PS, PK, PO } = saved);
  btBusy = false; btStop = false; $('labBtGo').textContent = 'Backtest'; rev++;
}

// ---------- drawing ----------
function paint(){
  if (!chart || !C.length || btBusy) return;
  const wrap = $('labChart'), cw = wrap.clientWidth, ch = wrap.clientHeight, dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(cw * dpr) || cv.height !== Math.round(ch * dpr)){ cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr); cv.style.width = cw + 'px'; cv.style.height = ch + 'px'; }
  x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, cw, ch);
  const T = chart.timeScale(), vr = T.getVisibleLogicalRange(); if (!vr) return;
  const pw = T.width(), ph = ch - T.height();
  const X = i => T.logicalToCoordinate(i), Y = p => ser.priceToCoordinate(p);
  const rect = (x1, y1, x2, y2, f, s) => { if ([x1,y1,x2,y2].some(v => v == null)) return; const l = Math.min(x1,x2), t = Math.min(y1,y2), w = Math.abs(x2-x1), h = Math.abs(y2-y1); if (f){ x.fillStyle = f; x.fillRect(l,t,w,h); } if (s){ x.strokeStyle = s; x.lineWidth = 1; x.strokeRect(l+.5,t+.5,w,h); } };
  const seg = (x1, y1, x2, y2, c, d, w) => { if ([x1,y1,x2,y2].some(v => v == null)) return; x.beginPath(); x.setLineDash(d || []); x.strokeStyle = c; x.lineWidth = w || 1; x.moveTo(x1,y1); x.lineTo(x2,y2); x.stroke(); x.setLineDash([]); };
  const txt = (t, px, py, c, al) => { if (px == null || py == null) return; x.font = '11px system-ui,"Noto Sans Thai",sans-serif'; x.textBaseline = 'middle'; x.textAlign = al || 'left'; x.fillStyle = c; x.fillText(t, px, py); };
  x.save(); x.beginPath(); x.rect(0, 0, pw, ph); x.clip();
  const a = Math.max(0, Math.floor(vr.from)), b = Math.min(C.length - 1, Math.ceil(vr.to));
  const runs = fn => { const r = []; let s = -1, k = null; for (let i = a; i <= b + 1; i++){ const v = i <= b ? fn(C[i].u) : null; if (v !== k){ if (k) r.push([s, i - 1, k]); s = i; k = v; } } return r; };
  if (ST[S.tf] <= 3600){
    if (S.sess) runs(kzOf).forEach(([i0, i1, k]) => { rect(X(i0 - .5), 0, X(i1 + .5), ph, `rgba(${SC[k]},.09)`); txt(k === 'LON' ? 'London KZ' : k === 'NY' ? 'New York KZ' : 'Asia', Math.max(2, X(i0 - .5)) + 3, 24, `rgba(${SC[k]},1)`); });
    if (S.qt) runs(qOf).forEach(([i0, i1, k]) => { rect(X(i0 - .5), 0, X(i1 + .5), 12, `rgba(${QC[k]},.55)`); txt(QN[k], Math.max(2, X(i0 - .5)) + 3, 7, '#fff'); });
  }
  if (S.smc && R){
    for (const g of R.fvgs){ const c = g.dir === 1 ? '77,163,255' : '198,120,221', x0 = X(g.idx); rect(x0, Y(g.top), pw, Y(g.bottom), `rgba(${c},.13)`, `rgba(${c},.35)`); txt('FVG', x0 + 3, Math.min(Y(g.top), Y(g.bottom)) + 8, `rgb(${c})`); }
    for (const o of R.obs){ const c = o.dir === 1 ? '46,189,155' : '239,91,91', x0 = X(o.idx); rect(x0, Y(o.top), pw, Y(o.bottom), `rgba(${c},.16)`, `rgba(${c},.6)`); txt(o.dir === 1 ? 'Bull OB' : 'Bear OB', x0 + 3, Math.min(Y(o.top), Y(o.bottom)) + 8, `rgb(${c})`); }
    for (const e of R.events){ const y = Y(e.price), c = e.dir === 1 ? UP : DOWN; seg(X(e.from), y, X(e.to), y, c, [5,4]); txt(e.type, (X(e.from) + X(e.to)) / 2, y + (e.dir === 1 ? -8 : 8), e.type === 'CHoCH' ? AMB : c, 'center'); }
  }
  if (S.swp) for (const s of SW){ const y = Y(s.lv), x2 = X(s.j); seg(X(s.p), y, x2, y, AMB, [2,3]); txt(s.isH ? 'BSL swept ✕' : 'SSL swept ✕', x2, y + (s.isH ? -9 : 9), AMB, 'center'); }
  if (S.crt && H.length > 1){
    const ref = H[H.length - 2], xr = X(ref.i0), hn = HN[HTF[S.tf]];
    rect(xr, Y(ref.high), pw, Y(ref.low), 'rgba(77,163,255,.05)');
    seg(xr, Y(ref.high), pw, Y(ref.high), 'rgba(77,163,255,.9)', null, 1.5); seg(xr, Y(ref.low), pw, Y(ref.low), 'rgba(77,163,255,.9)', null, 1.5);
    seg(xr, Y((ref.high + ref.low) / 2), pw, Y((ref.high + ref.low) / 2), 'rgba(77,163,255,.6)', [4,4]);
    txt(`CRT ${hn} High`, pw - 4, Y(ref.high) - 8, '#4da3ff', 'right'); txt(`CRT ${hn} Low`, pw - 4, Y(ref.low) + 8, '#4da3ff', 'right'); txt('50%', pw - 4, Y((ref.high + ref.low) / 2) - 8, 'rgba(77,163,255,.8)', 'right');
    for (const c of CR.slice(-3)){
      const col = c.dir === 1 ? UP : DOWN, xs = X(c.b.i0), xe = X(c.b.i1 + .5);
      txt(`CRT ${c.dir === 1 ? '↑' : '↓'}${c.forming ? ' (กำลังก่อตัว)' : ''}`, xs, Y(c.dir === 1 ? c.b.low : c.b.high) + (c.dir === 1 ? 12 : -12), col);
      seg(xe, Y(c.tgt), pw, Y(c.tgt), col, [6,4]); txt('เป้า CRT', pw - 4, Y(c.tgt) + (c.dir === 1 ? -8 : 8), col, 'right');
    }
  }
  if (S.plan && M && M.plan){
    const p = M.plan, x1 = X(p.start), bw = (X(10) - X(0)) / 10, x2 = x1 + 16 * bw;
    rect(x1, Y(p.entry), x2, Y(p.sl), 'rgba(239,91,91,.16)'); rect(x1, Y(p.entry), x2, Y(p.tp1), 'rgba(46,189,155,.15)'); rect(x1, Y(p.tp1), x2, Y(p.tp2), 'rgba(46,189,155,.08)');
    seg(x1, Y(p.entry), x2, Y(p.entry), '#e8edf5', [4,3]); seg(x1, Y(p.sl), x2, Y(p.sl), DOWN, null, 1.5); seg(x1, Y(p.tp1), x2, Y(p.tp1), UP, null, 1.5); seg(x1, Y(p.tp2), x2, Y(p.tp2), UP, [5,4]);
    txt(`${p.dir === 1 ? 'LONG' : 'SHORT'} ${fmt(p.entry)}`, x2 - 3, Y(p.entry) - 8, '#e8edf5', 'right'); txt(`SL ${fmt(p.sl)}`, x2 - 3, Y(p.sl) + (p.dir === 1 ? 8 : -8), DOWN, 'right'); txt(`TP1 ${fmt(p.tp1)}`, x2 - 3, Y(p.tp1) + (p.dir === 1 ? -8 : 8), UP, 'right');
  }
  if (S.po3 && PO){
    ZONES.forEach(([a, b2, k]) => rect(0, Y(lv(a)), pw, Y(lv(b2)), `rgba(${ZC[k]},.10)`));
    ZONES.forEach(([a, b2, k]) => { const ya = Y(lv(a)), yb = Y(lv(b2)); if (ya != null && yb != null) txt(k, pw - 4, (ya + yb) / 2, `rgba(${ZC[k]},1)`, 'right'); });
    IPDA.forEach(([q, k]) => { const y = Y(lv(q)), mj = q === 0 || q === 100; seg(0, y, pw, y, mj ? '#e8edf5' : 'rgba(151,163,179,.4)', q === 50 ? [4,4] : null, mj ? 1.5 : 1); txt(`${q} ${k} ${fmt(lv(q))}`, 4, y == null ? null : y - 7, mj ? '#e8edf5' : 'rgba(151,163,179,.9)'); });
    [PO.hi + .111 * PO.size, PO.lo - .111 * PO.size].forEach((v, i) => { const y = Y(v); seg(0, y, pw, y, AMB, [3,5]); txt(i ? 'ERD -11.1%' : 'ERD +11.1%', 4, y == null ? null : y + (i ? 9 : -9), AMB); });
  }
  if (S.po3 && IP){
    const x1 = X(C.length - 1), tags = [];
    rect(x1, Y(IP.z1), pw, Y(IP.z2), 'rgba(233,185,73,.28)', AMB);
    seg(x1, Y(IP.entry), pw, Y(IP.entry), '#e8edf5', [4,3]); txt(`ENTRY ${IP.dir === 1 ? 'LONG' : 'SHORT'} ${fmt(IP.entry)} (Algo ${IP.algo})`, pw - 4, Y(IP.entry) == null ? null : Y(IP.entry) - 8, '#e8edf5', 'right');
    seg(x1, Y(IP.sl), pw, Y(IP.sl), DOWN, null, 1.5); txt(`SL ${fmt(IP.sl)}`, pw - 4, Y(IP.sl) == null ? null : Y(IP.sl) + 8, DOWN, 'right');
    IP.tps.forEach((t, i) => { seg(x1, Y(t), pw, Y(t), UP, i ? [5,4] : null, 1.5); txt(`TP${i + 1} ${fmt(t)} · RR ${IP.rr[i].toFixed(1)}`, pw - 4, Y(t) == null ? null : Y(t) - 8, UP, 'right'); });
  }
  if (S.lb && LB){
    LB.anchors.forEach(a => { let i = 0; while (i < C.length && C[i].u < a.t) i++; const xx = X(i); seg(xx, 0, xx, ph, 'rgba(233,185,73,.5)', [5,4]); txt(String(a.n), xx == null ? null : xx + 3, ph - 8, AMB); });
    LB.gaps.forEach(g => { let i = 0; while (i < C.length && C[i].u < g.t) i++; rect(X(i), Y(g.top), pw, Y(g.bottom), 'rgba(77,163,255,.12)', 'rgba(77,163,255,.8)'); txt(`LB ${LB.n} FVG`, X(i) == null ? null : Math.max(2, X(i)) + 3, Y(g.top) == null ? null : Y(g.top) + 9, '#4da3ff'); });
    if (LB.plan){ const p = LB.plan, x1 = X(C.length - 1); seg(x1, Y(p.entry), pw, Y(p.entry), '#4da3ff', [4,3], 1.5); txt(`LB ENTRY ${fmt(p.entry)}`, pw - 4, Y(p.entry) == null ? null : Y(p.entry) - 8, '#4da3ff', 'right'); }
  }
  if (S.amd && ST[S.tf] <= 3600){
    runs(amdOf).forEach(([i0, i1, k]) => { const c = k === 'A' ? '46,189,155' : k === 'M' ? '239,91,91' : '233,185,73'; rect(X(i0 - .5), 14, X(i1 + .5), 26, `rgba(${c},.55)`); txt(k === 'A' ? 'A สะสม' : k === 'M' ? 'M หลอก' : 'D กระจาย', Math.max(2, X(i0 - .5)) + 3, 20, '#fff'); });
    runs(sweetOf).forEach(([i0, i1, k]) => { rect(X(i0 - .5), 0, X(i1 + .5), ph, 'rgba(239,91,91,.10)'); txt(k === 'LO' ? 'London sweet' : 'NY sweet', Math.max(2, X(i0 - .5)) + 3, 40, '#ef5b5b'); });
  }
  if (S.smt && SM && C[SM.p1] && C[SM.p2]){
    const up = SM.dir === 1, k1 = up ? C[SM.p1].low : C[SM.p1].high, k2 = up ? C[SM.p2].low : C[SM.p2].high, xa = X(SM.p1), xb = X(SM.p2);
    seg(xa, Y(k1), xb, Y(k2), '#c678dd', [4,3], 2); txt(`SMT ${up ? '↑' : '↓'} vs ${S.smtSym}`, xb == null ? null : xb + 4, Y(k2) == null ? null : Y(k2) + (up ? 12 : -12), '#c678dd');
  }
  if (S.smt && PS && C[PS.bar]){
    const up = PS.dir === 1, xb = X(PS.bar), yb = Y(up ? C[PS.bar].low : C[PS.bar].high);
    txt(`PSP ${up ? '↑' : '↓'}`, xb, yb == null ? null : yb + (up ? 14 : -14), '#e8edf5', 'center');
  }
  x.restore();
}
function loop(){
  if (chart && !$('vLab').hidden && !btBusy){
    const r = chart.timeScale().getVisibleLogicalRange(), w = $('labChart');
    let sig = rev + '|' + w.clientWidth + 'x' + w.clientHeight; if (r) sig += '|' + r.from.toFixed(2) + '|' + r.to.toFixed(2);
    if (C.length){ const c = C[C.length - 1].close; sig += '|' + ser.priceToCoordinate(c) + '|' + ser.priceToCoordinate(c * 1.01); }
    if (sig !== lastSig){ lastSig = sig; paint(); }
  }
  requestAnimationFrame(loop);
}

// ---------- ui ----------
function init(){
  if (chart) return;
  chart = LightweightCharts.createChart($('labChart'), { autoSize:true, layout:{ background:{ color:'#0d1117' }, textColor:'#97a3b3' }, grid:{ vertLines:{ color:'#18202a' }, horzLines:{ color:'#18202a' } },
    rightPriceScale:{ borderColor:'#232c38', minimumWidth:72 }, timeScale:{ borderColor:'#232c38', timeVisible:true, secondsVisible:false, rightOffset:6 } });
  ser = chart.addCandlestickSeries({ upColor:UP, downColor:DOWN, wickUpColor:UP, wickDownColor:DOWN, borderVisible:false });
  cv = $('labOv'); x = cv.getContext('2d');
  const tb = $('labTfs');
  TFS.forEach(tf => { const bt = document.createElement('button'); bt.className = 'btn'; bt.textContent = tf; bt.dataset.tf = tf; bt.onclick = () => { S.tf = tf; save(); sync(); load(); }; tb.appendChild(bt); });
  $('labBar').addEventListener('change', e => { const k = e.target.dataset.k; if (!k) return; S[k] = e.target.checked ? 1 : 0; save(); analyze(); rev++; });
  const go = () => { const v = $('labSym').value.trim().toUpperCase().replace('/', ''); if (v){ S.sym = v; save(); load(); } };
  $('labGo').onclick = go; $('labSym').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  $('labPr').onchange = e => { S.pr = +e.target.value; save(); analyze(); rev++; };
  $('labSmt').onchange = async e => { const v = e.target.value.trim().toUpperCase().replace('/', ''); if (v){ S.smtSym = v; save(); await refreshCorr(); analyze(); rev++; } };
  $('labCorr').onchange = async e => { S.corr = +e.target.value; save(); await refreshCorr(); analyze(); rev++; };
  $('labBtGo').onclick = () => runBacktest();
  sync(); requestAnimationFrame(loop);
}
function sync(){
  $('labSym').value = S.sym; $('labPr').value = S.pr; $('labSmt').value = S.smtSym; $('labCorr').value = String(S.corr);
  $('labTfs').querySelectorAll('.btn').forEach(b => b.classList.toggle('on', b.dataset.tf === S.tf));
  $('labBar').querySelectorAll('[data-k]').forEach(i => i.checked = !!S[i.dataset.k]);
}
async function load(){
  const my = ++gen; status('กำลังโหลด…');
  try {
    const arr = await fetchData(); if (my !== gen) return;
    const seen = new Set();
    C = arr.filter(c => c.u && !seen.has(c.u) && seen.add(c.u)).sort((p, q) => p.u - q.u).slice(-1500).map(c => ({ ...c, time:c.u + BKK }));
    if (!C.length) throw new Error('ไม่พบข้อมูลของ ' + S.sym);
    dec = C[C.length-1].close >= 1 ? 2 : 4;
    ser.applyOptions({ priceFormat:{ type:'price', precision:dec, minMove:Math.pow(10, -dec) } });
    ser.setData(C.map(c => ({ time:c.time, open:c.open, high:c.high, low:c.low, close:c.close })));
    try { D = await fetchDaily(); } catch(e){ D = []; } if (my !== gen) return;
    await refreshCorr(); if (my !== gen) return;
    if (corrTimer) clearInterval(corrTimer);
    corrTimer = setInterval(async () => { if (btBusy) return; await refreshCorr(); analyze(); rev++; }, 60000);
    analyze();
    const n = C.length; chart.timeScale().setVisibleLogicalRange({ from:Math.max(0, n - 150), to:n + 8 });
    rev++; status(`${S.sym} ${S.tf} · ${n} แท่ง · เวลาไทย`); live();
  } catch(e){ if (my === gen) status('โหลดไม่สำเร็จ: ' + e.message); }
}
// ---------- realtime (Binance WebSocket, ไม่ต้องใช้ API key) ----------
function live(){
  if (ws){ try { ws.close(); } catch(e){} ws = null; }
  const my = gen, pair = (MAP[S.sym] || S.sym).toLowerCase();
  let sock;
  try { sock = ws = new WebSocket(`wss://data-stream.binance.vision/ws/${pair}@kline_${S.tf}`); } catch(e){ return; }
  sock.onmessage = ev => {
    if (my !== gen || !C.length || btBusy) return;
    let k; try { k = JSON.parse(ev.data).k; } catch(e){ return; } if (!k) return;
    const u = Math.floor(k.t / 1000), c = { u, time:u + BKK, open:+k.o, high:+k.h, low:+k.l, close:+k.c }, last = C[C.length - 1];
    if (u === last.u) C[C.length - 1] = c; else if (u > last.u){ C.push(c); KC.push(null); } else return;
    ser.update({ time:c.time, open:c.open, high:c.high, low:c.low, close:c.close });
    const now = Date.now(); if (now - lastAn > 1500){ lastAn = now; analyze(); }
    rev++; status(`● LIVE ${S.sym} ${S.tf} · ${fmt(c.close)} · เวลาไทย`);
  };
  sock.onclose = () => { if (sock === ws && my === gen) setTimeout(() => { if (sock === ws && my === gen) live(); }, 3000); };
}
window.addEventListener('labshow', () => { init(); if (!C.length) load(); setTimeout(() => window.dispatchEvent(new Event('resize')), 60); });
})();
